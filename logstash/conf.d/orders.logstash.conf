# =============================================================================
# Logstash Orders Pipeline: Syncs orders data from MariaDB into the opensearch  "orders" index.
# =============================================================================

input {
  jdbc {
    # -------------------------------------------------------------------------
    # Connection
    # -------------------------------------------------------------------------
    jdbc_driver_library => "/usr/share/logstash/drivers/mariadb-connector.jar"
    jdbc_driver_class   => "org.mariadb.jdbc.Driver"
    jdbc_connection_string => "jdbc:mariadb://mariadb:3306/orders_service?useSSL=false&sessionVariables=sql_mode=ANSI_QUOTES"
    jdbc_user               => "root"
    jdbc_password           => "1"
    jdbc_default_timezone => "Africa/Cairo"

    # -------------------------------------------------------------------------
    # Incremental tracking && Pagination
    # -------------------------------------------------------------------------
    use_column_value       => true
    tracking_column        => "sync_cursor"
    tracking_column_type   => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/sync_state/logistic_centers_facilities_last_run"
    schedule                => "*/5 * * * *"
    jdbc_paging_enabled => true
    jdbc_page_size      => 100

    # -------------------------------------------------------------------------
    # fetching query
    # -------------------------------------------------------------------------
    statement => "

      SELECT

        o.id,
        COALESCE(o.updated_at, o.created_at) AS sync_cursor,

        o.order_number,
        o.status,
        o.payment_status,
        o.currency,

        o.subtotal,
        o.discount,
        o.shipping_cost,
        o.tax,
        o.total,

        o.created_at,
        o.updated_at,


        JSON_OBJECT(
          'id', c.id,
          'name', c.name,
          'email', c.email,
          'mobile', c.mobile
        ) AS customer,

        JSON_OBJECT(
          'id', sa.id,
          'country', sa.country,
          'city', sa.city,
          'address', sa.address,
          'postal_code', sa.postal_code
        ) AS shipping_address,

        COALESCE(
          (
            SELECT JSON_ARRAYAGG(
              JSON_OBJECT(
                'id', oi.id,
                'product_id', oi.product_id,
                'product_name', oi.product_name,
                'quantity', oi.quantity,
                'unit_price', oi.unit_price,
                'discount', oi.discount,
                'total',
                  (
                    (oi.quantity * oi.unit_price)
                    - COALESCE(oi.discount, 0)
                  )
              )
            )
            FROM order_items oi
            WHERE oi.order_id = o.id
          ),
          JSON_ARRAY()
        ) AS items,


        IF(
          o.payment_status = 'paid',
          1,
          0
        ) AS paid,

        IF(
          o.status IN ('completed', 'delivered'),
          1,
          0
        ) AS completed,

        IF(
          o.status IN ('cancelled', 'refunded'),
          1,
          0
        ) AS cancelled
      FROM orders o

      LEFT JOIN customers c
        ON c.id = o.customer_id

      LEFT JOIN shipping_addresses sa
        ON sa.id = o.shipping_address_id

      WHERE COALESCE(o.updated_at, o.created_at) > :sql_last_value
      ORDER BY sync_cursor ASC
    "
  }
}


# =============================================================================
# Filter
# =============================================================================

filter {

  mutate {
    remove_field => [
      "sync_cursor",
      "@version",
      "@timestamp"
    ]
  }

  json {
    source => "customer"
    target => "customer"
  }

  json {
    source => "shipping_address"
    target => "shipping_address"
  }

  json {
    source => "items"
    target => "items"
  }


  mutate {
    convert => {

      "id"            => "integer"

      "subtotal"      => "float"
      "discount"      => "float"
      "shipping_cost" => "float"
      "tax"           => "float"
      "total"         => "float"

      "paid"          => "boolean"
      "completed"     => "boolean"
      "cancelled"     => "boolean"
    }
  }

  mutate {
    lowercase => [
      "status",
      "payment_status"
    ]
  }


  # ---------------------------------------------------------------------------
  # Add discount_percentage information
  # ---------------------------------------------------------------------------

  ruby {
    code => '

      total = event.get("total")
      subtotal = event.get("subtotal")

      if total && subtotal && subtotal.to_f > 0
        event.set(
          "discount_percentage",
          ((subtotal.to_f - total.to_f) / subtotal.to_f * 100).round(2)
        )
      end

    '
  }


  # ---------------------------------------------------------------------------
  # Ensure items is always an array
  # ---------------------------------------------------------------------------

  ruby {
    code => '

      items = event.get("items")

      if items.nil?
        event.set("items", [])
      elsif items.is_a?(String)
        begin
          event.set("items", LogStash::Json.load(items))
        rescue
          event.set("items", [])
        end
      end

    '
  }
}


# =============================================================================
# Output
# =============================================================================
output {
 opensearch {
    hosts => ["http://opensearch-node1:9200"]
    index       => "orders"
    document_id => "%{id}"
    action      => "index"
  }

  stdout { codec => rubydebug }
}